# Local development stack: PostgreSQL, Redis and the API with the simulated device provider.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nuvola
      POSTGRES_USER: nuvola
      POSTGRES_PASSWORD: nuvola
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuvola"]
      interval: 5s
      retries: 10

  # Not used by the code yet: reserved for the multi-instance rate limiter and stream-session cache.
  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/nuvola
      DATABASE_USER: nuvola
      DATABASE_PASSWORD: nuvola
      DEVICE_PROVIDER: mock
    ports: ["8080:8080"]

volumes:
  pgdata:
