<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>قارئ الملفات والصور</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/theme.js"></script>
</head>
<body>
<div class="app">
  <aside id="sidebar" class="sidebar" aria-label="المحادثات" data-i18n-attr="aria-label:conversations">
    <div class="sidebar-head">
      <div class="brand">
        <img src="/static/icon.svg" alt="" width="28" height="28">
        <span data-i18n="appName">قارئ الملفات والصور</span>
      </div>
      <button class="icon-btn only-mobile" id="closeSidebar" type="button" data-i18n-attr="aria-label:close" aria-label="إغلاق">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <button id="newChat" class="new-chat" type="button">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span data-i18n="newChat">محادثة جديدة</span>
    </button>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" autocomplete="off" data-i18n-attr="placeholder:searchPlaceholder" placeholder="ابحث في المحادثات">
    </div>
    <nav id="convList" class="conv-list"></nav>
    <div class="sidebar-foot">
      <div id="aiStatus" class="ai-status" role="status"></div>
      <div class="foot-actions">
        <button id="langToggle" class="chip-btn" type="button">English</button>
        <button id="themeToggle" class="chip-btn" type="button"></button>
      </div>
    </div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="openSidebar" type="button" data-i18n-attr="aria-label:menu" aria-label="القائمة">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1 id="convTitle" class="conv-title" data-i18n="newChat">محادثة جديدة</h1>
      <button class="icon-btn" id="renameCurrent" type="button" hidden data-i18n-attr="aria-label:rename;title:rename" aria-label="إعادة تسمية">
        <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>
      </button>
    </header>

    <section id="messages" class="messages" aria-live="polite"></section>

    <footer class="composer-wrap" id="dropZone">
      <div id="pending" class="pending" hidden></div>
      <form id="composer" class="composer" autocomplete="off">
        <div class="input-box">
          <textarea id="input" rows="1" dir="auto" data-i18n-attr="placeholder:placeholder" placeholder="اسأل عن ملفاتك..."></textarea>
          <div class="input-tools">
            <button type="button" class="tool-btn" id="attachFile" data-i18n-attr="aria-label:attachFile;title:attachFile" aria-label="إرفاق ملف" title="إرفاق ملف">
              <svg viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5 5 0 01-7.1-7.1l8.6-8.6a3.5 3.5 0 015 5l-8.6 8.6a2 2 0 01-2.8-2.8l7.9-7.9"/></svg>
            </button>
            <button type="button" class="tool-btn" id="attachImage" data-i18n-attr="aria-label:attachImage;title:attachImage" aria-label="إرفاق صورة" title="إرفاق صورة">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="send-btn" id="send" data-i18n-attr="aria-label:send;title:send" aria-label="إرسال" title="إرسال">
          <svg class="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
        </button>
      </form>
      <p class="hint" data-i18n="hint">Enter للإرسال، و Shift+Enter لسطر جديد</p>
      <input type="file" id="fileInput" multiple hidden
             accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.csv,.md,.markdown">
      <input type="file" id="imageInput" multiple hidden accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">
      <div class="drop-overlay" id="dropOverlay" hidden><span data-i18n="dropHere">أفلت الملفات هنا</span></div>
    </footer>
  </main>
</div>

<dialog id="dialog" class="dialog">
  <form method="dialog" id="dialogForm">
    <h2 id="dialogTitle"></h2>
    <p id="dialogText"></p>
    <input id="dialogInput" type="text" dir="auto" maxlength="200">
    <div class="dialog-actions">
      <button value="cancel" type="submit" class="btn ghost" id="dialogCancel"></button>
      <button value="ok" type="submit" class="btn" id="dialogOk"></button>
    </div>
  </form>
</dialog>

<div id="toasts" class="toasts" aria-live="assertive"></div>

<script src="/static/i18n.js"></script>
<script src="/static/markdown.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
