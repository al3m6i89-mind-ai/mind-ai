spring:
  application:
    name: nuvola-backend
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nuvola}
    username: ${DATABASE_USER:nuvola}
    password: ${DATABASE_PASSWORD:nuvola}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

app:
  environment: ${APP_ENV:development}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  terms-version: "2026-10"
  terms-url: ${TERMS_URL:https://example.invalid/terms}
  privacy-url: ${PRIVACY_URL:https://example.invalid/privacy}
  support-email: ${SUPPORT_EMAIL:support@example.invalid}
  min-supported-app-version: 1
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    login-attempts-per-email: 5
    login-attempts-per-ip: 30
    login-window: 15m
  mail:
    from: ${MAIL_FROM:no-reply@example.invalid}
    # "log" prints links to the server log (development). "smtp" sends real mail.
    transport: ${MAIL_TRANSPORT:log}
  devices:
    provider: ${DEVICE_PROVIDER:mock}
    job-poll-interval: PT1S
    job-timeout: PT10M
    mock-step-delay: PT2S
  streaming:
    session-token-ttl: PT60S
  billing:
    # Only for local development: lets a signed-in user activate a plan without paying.
    allow-unpaid-dev-subscriptions: false
  account:
    deletion-grace-days: 14
