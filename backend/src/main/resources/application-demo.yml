# Public demo server: no payments, no outgoing email. Phones are simulated unless
# DEVICE_PROVIDER=redroid points it at a real phone node.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev,classpath:db/redroid
app:
  environment: demo
  mail:
    transport: log
  billing:
    allow-unpaid-dev-subscriptions: true
  account:
    auto-verify-email: true
