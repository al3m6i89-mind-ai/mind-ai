name: Build File Chat APK

on:
  push:
    branches: [file-chat-apk]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      # The release key is kept by the owner, not in this public repo: the unsigned APK is
      # committed to dist/ and signed outside CI.
      - name: Commit unsigned APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/file-chat-unsigned.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/file-chat-unsigned.apk
          git commit -m "Build unsigned APK (run ${{ github.run_number }}) [skip ci]"
          # GitHub sometimes answers a push with a transient 500; retry a few times.
          for i in 1 2 3 4 5; do git push && exit 0; sleep $((i * 5)); git pull --rebase; done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-chat-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
