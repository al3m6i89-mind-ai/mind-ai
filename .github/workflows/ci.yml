name: CI

on:
  push:
    branches: [main, nuvola-cloudphone]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nuvola_test
          POSTGRES_USER: nuvola
          POSTGRES_PASSWORD: nuvola
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nuvola" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDevDebug assembleDemoDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nuvola-dev-debug-apk
          path: android/app/build/outputs/apk/dev/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nuvola-demo-apk
          path: android/app/build/outputs/apk/demo/debug/*.apk

  android-smoke:
    # Launches the app on an emulator so start-up crashes are caught before anyone installs it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: ./gradlew assembleDevDebug assembleDemoDebug --no-daemon
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          working-directory: android
          script: ./scripts/smoke.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logcat
          path: |
            android/logcat.txt
            android/screen.png

  node-e2e:
    # Installs a real phone node with the same script users run, boots Android (with Google Play
    # and a Magisk root image), streams the screen, sends input and walks the whole lifecycle.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: node-agent/go.sum
      - name: Unit tests
        working-directory: node-agent
        run: go test ./...
      - name: Install node
        # x86 reaches the node through a Cloudflare quick tunnel, like a home laptop does.
        run: |
          sudo ANDROID_VERSIONS=13 MAX_DEVICES=2 SKIP_HTTPS=1 AGENT_SRC="$PWD/node-agent" \
            TUNNEL=${{ matrix.runner == 'ubuntu-24.04' && 'cloudflare' || 'none' }} \
            BACKEND_URL=http://127.0.0.1:8080/api/v1 bash node-agent/install.sh
      - name: End-to-end
        working-directory: node-agent
        run: |
          token=$(sudo sed -n 's/^NODE_TOKEN=//p' /opt/nuvola/node.env)
          NODE_URL=http://127.0.0.1:7100 NODE_TOKEN="$token" ANDROID_VERSION=13 \
            CHECK_GAPPS=1 CHECK_MAGISK=1 SCREENSHOT="$GITHUB_WORKSPACE/phone-screen.png" go run ./cmd/e2e
      - name: Full stack (backend + node through the tunnel)
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          token=$(sudo sed -n 's/^NODE_TOKEN=//p' /opt/nuvola/node.env)
          docker run -d --name pg --network host -e POSTGRES_DB=nuvola -e POSTGRES_USER=nuvola -e POSTGRES_PASSWORD=nuvola postgres:16
          docker build -q -t nuvola/backend backend
          docker run -d --name backend --network host -e SPRING_PROFILES_ACTIVE=demo -e DB_HOST=127.0.0.1 \
            -e JWT_SECRET=ci-secret-ci-secret-ci-secret-ci-secret-1234 -e DEVICE_PROVIDER=auto \
            -e REDROID_NODE_TOKEN="$token" nuvola/backend
          EXPECT_GATEWAY_PREFIX=wss:// bash node-agent/scripts/fullstack.sh
      - if: always()
        run: |
          docker logs backend > backend.log 2>&1 || true
          docker logs nuvola-agent > agent.log 2>&1 || true
          docker logs nuvola-tunnel > tunnel.log 2>&1 || true
          docker image ls > images.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-e2e-${{ matrix.runner }}
          path: |
            agent.log
            backend.log
            tunnel.log
            images.txt
            phone-screen.png
