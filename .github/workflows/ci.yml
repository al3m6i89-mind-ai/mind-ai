name: CI

on:
  push:
    branches: [main, nuvola-cloudphone]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nuvola_test
          POSTGRES_USER: nuvola
          POSTGRES_PASSWORD: nuvola
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nuvola" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDevDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nuvola-dev-debug-apk
          path: android/app/build/outputs/apk/dev/debug/*.apk
