name: Build File Chat APK (Flutter)

on:
  push:
    branches: [file-chat-app]
    paths-ignore: ['dist/**']
  workflow_dispatch:

permissions:
  contents: write

# Only the newest push is built; an older build still running is cancelled
# so two builds never race to commit dist/.
concurrency:
  group: file-chat-apk
  cancel-in-progress: true

jobs:
  # Deploys the Cloudflare proxy that holds the AI keys, and hands its address
  # to the app build. Skipped (the app then uses only the keyless free server)
  # until the Cloudflare secrets are added to the repository.
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_TOKEN: ${{ secrets.APP_TOKEN }}
      GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
      GROQ_KEYS: ${{ secrets.GROQ_KEYS }}
      MISTRAL_KEYS: ${{ secrets.MISTRAL_KEYS }}
      OPENROUTER_KEYS: ${{ secrets.OPENROUTER_KEYS }}
      CEREBRAS_KEYS: ${{ secrets.CEREBRAS_KEYS }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node proxy/test.mjs
      - name: Deploy proxy
        id: deploy
        working-directory: proxy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$APP_TOKEN" ]; then
            echo "::warning::Cloudflare secrets not set; the app will use only the keyless free server."
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          sub=$(curl -sf -H "$auth" "$api" | jq -r '.result.subdomain // empty' || true)
          if [ -z "$sub" ]; then
            # A new account has no workers.dev name yet; make one.
            sub="filechat-$(echo "$CLOUDFLARE_ACCOUNT_ID" | cut -c1-8)"
            curl -sf -X PUT -H "$auth" -H 'Content-Type: application/json' -d "{\"subdomain\":\"$sub\"}" "$api" > /dev/null
          fi
          npx --yes wrangler@4 deploy
          # Only the secrets that are set; values never reach the log.
          node -e '
            const names = ["APP_TOKEN","GEMINI_KEYS","GROQ_KEYS","MISTRAL_KEYS","OPENROUTER_KEYS","CEREBRAS_KEYS","POLLINATIONS_TOKEN","PLAY_SERVICE_ACCOUNT"];
            const out = {}; for (const n of names) if (process.env[n]) out[n] = process.env[n];
            require("fs").writeFileSync("/tmp/secrets.json", JSON.stringify(out));'
          npx --yes wrangler@4 secret bulk /tmp/secrets.json
          rm /tmp/secrets.json
          echo "url=https://file-chat-proxy.$sub.workers.dev" >> "$GITHUB_OUTPUT"
      - name: Check proxy
        if: steps.deploy.outputs.url != ''
        continue-on-error: true
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          sleep 10
          curl -sS -o cfg.json -w "config: %{http_code}\n" "$URL/config" -H "x-app-token: $APP_TOKEN"
          jq -c '[.chain[] | .p + ":" + .model]' cfg.json
          for m in $(jq -r '.chain[] | select(.backend=="gemini") | .model' cfg.json); do
            code=$(curl -sS -o out.json -w "%{http_code}" -H "x-app-token: $APP_TOKEN" -H "x-ci: $GEMINI_KEYS" -H 'Content-Type: application/json' \
              -d '{"contents":[{"parts":[{"text":"Reply with the single word OK"}]}]}' \
              "$URL/g/v1beta/models/$m:generateContent")
            echo "$m: $code $(jq -r '.candidates[0].content.parts[0].text // .error.message' out.json | head -c 120)"
          done
          code=$(curl -sS -o out.json -w "%{http_code}" -H "x-app-token: $APP_TOKEN" -H "x-ci: $GEMINI_KEYS" -H 'Content-Type: application/json' \
            -d '{"model":"openai","messages":[{"role":"user","content":"Reply with the single word OK"}]}' "$URL/p/v1/chat/completions")
          echo "pollinations: $code $(head -c 160 out.json)"
          for m in $(jq -r '.chain[] | select(.backend=="openai" and .p!="p") | .p + "|" + .model' cfg.json); do
            p=${m%%|*}; model=${m#*|}
            code=$(curl -sS -o out.json -w "%{http_code}" -H "x-app-token: $APP_TOKEN" -H "x-ci: $GEMINI_KEYS" -H 'Content-Type: application/json' \
              -d "{\"model\":\"$model\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with the single word OK\"}]}" "$URL/$p/v1/chat/completions")
            echo "$p $model: $code $(jq -r '.choices[0].message.content // .error.message // .' out.json 2>/dev/null | head -c 120)"
          done
          echo "groq models: $(curl -s "$URL/q/v1/models" -H "x-app-token: $APP_TOKEN" -H "x-ci: $GEMINI_KEYS" | jq -r '[.data[]?.id] | join(",")' 2>/dev/null)"
          echo "wrong token: $(curl -s -o /dev/null -w '%{http_code}' "$URL/config" -H 'x-app-token: nope')"
          echo "no sign-in: $(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/q/v1/chat/completions" -H "x-app-token: $APP_TOKEN")"
          echo "other path: $(curl -s -o /dev/null -w '%{http_code}' "$URL/g/v1beta/files" -H "x-app-token: $APP_TOKEN" -H "x-ci: $GEMINI_KEYS")"
          echo "privacy page: $(curl -s -o /dev/null -w '%{http_code}' "$URL/privacy")"
          echo "delete page: $(curl -s -o /dev/null -w '%{http_code}' "$URL/delete")"
          echo "voice path: $(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/q/v1/audio/transcriptions" -H "x-app-token: $APP_TOKEN")"
          URL="$URL" CI_KEY="$GEMINI_KEYS" node proxy/tools/latency.mjs || true

  build:
    needs: proxy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # 64-bit ARM only: every current Android phone, at about a third of the size.
      - run: >-
          flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}
          --dart-define=PROXY_URL=${{ needs.proxy.outputs.url }}
          --dart-define=APP_TOKEN=${{ secrets.APP_TOKEN }}
      # The release key is kept by the owner, not in this public repo: the unsigned APK is
      # committed to dist/ and signed outside CI.
      - name: Commit unsigned APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/file-chat-unsigned.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/file-chat-unsigned.apk
          git commit -m "Build unsigned APK (run ${{ github.run_number }}) [skip ci]"
          # GitHub sometimes answers a push with a transient 500; retry a few times.
          for i in 1 2 3 4 5; do git push && exit 0; sleep $((i * 5)); git pull --rebase -X theirs; done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-chat-unsigned-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      # Same app for the x86_64 emulator used by the launch check below.
      - run: >-
          flutter build apk --release --target-platform android-x64 --build-number=${{ github.run_number }}
          --dart-define=PROXY_URL=${{ needs.proxy.outputs.url }}
          --dart-define=APP_TOKEN=${{ secrets.APP_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: file-chat-x64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3

  # Installs the build on an emulator and opens it, to catch crashes at launch.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: file-chat-x64-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Sign with a throwaway key (test only)
        run: |
          keytool -genkeypair -keystore t.jks -storepass android -keypass android -alias t -keyalg RSA -dname CN=t -validity 3 -noprompt
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner sign --ks t.jks --ks-pass pass:android --out test.apk app-release.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r test.apk
            adb logcat -c
            adb shell am start -n com.zuhair.file_chat/.MainActivity
            sleep 40
            echo "pid: $(adb shell pidof com.zuhair.file_chat)"
            adb logcat -d | grep -E "AndroidRuntime|FATAL|flutter|file_chat|E/|Exception" | grep -v "chatty" | head -150
            adb shell pidof com.zuhair.file_chat
